# Incrementally add a new dataset into an existing processed corpus.
#
# Flow:
# 0. Apply pre_tag_rules (optional) to tag records before any processing
# 1. Run Phase 1 processors on new_data_path only
# 2. Combine with existing_data_path and run exact + fuzzy dedup
# 3. Keep only surviving new records and run post-dedup processors
# 4. Merge existing records with the newly classified survivors
#
# Paths may be absolute or relative to this config file.

name: add_new_dataset

# CanonicalRecord parquet or shard directory for the new dataset.
new_data_path: ../../data/intermediate/new_dataset_shards

# Existing processed corpus to preserve and extend.
existing_data_path: ../../data/processed/math_clean_classified_v2.parquet

# Final merged output path.
output_path: ../../data/processed/math_clean_classified_with_new.parquet

# Checkpoints for phase boundaries and per-phase pipeline resumes.
checkpoint_dir: ../../artifacts/checkpoints/add_new_dataset

# Base pipeline config that defines the processor list to reuse.
pipeline_config: math_clean_pipeline_v2.yaml

# Dataset names that belong to the newly added corpus.
new_dataset_names:
  - NewDataset

# Lower priority means larger tier number.
# Existing math_clean_pipeline_v2 tiers are 1-3, so new data typically uses 4.
new_dataset_priority_tier: 4

# If true, output_path receives ONLY the new surviving records (not merged).
# Use this when you need to run LLM classification on the new data before merging.
# After LLM classification, use `pipeline merge-records` to produce the final corpus.
# skip_merge: false

# Pre-tag rules: tag specific records BEFORE Phase 1 processing.
# Reads the original source parquet (not the ingested shards) to look up UIDs
# matching a condition, then sets training_phase (and optionally filter_tag)
# on the corresponding CanonicalRecords.
#
# pre_tag_rules:
#   - source_parquet: /absolute/path/to/source.parquet  # parquet with uid + nested field
#     field: "meta_data.domain"                          # dotted path into struct column
#     match_value: "math_proof"                          # value to match
#     training_phase: "midtrain"                         # training_phase to set
#     filter_tag: ""                                     # optional filter_tag to set

# Default worker count for reading and per-phase pipeline execution.
workers: 96
